ot connect to the development server.", "known"], ["04 · Webpack workaround", "npm run dev -- --webpack started Next.js successfully (Ready).", "known"], ["05 · API returned 404", "Server was running, but /api/orders returned 404. Both root app and src/app existed.", "known"], ["06 · Correct route placement", "Moved route.ts from src/app to root app/api/orders; verified HTTP 200 and three JSON orders.", "known"]], "concepts32": [["route.ts", "Defines an API route in the active App Router tree"], ["GET()", "Exported handler for HTTP GET requests"], ["Response.json()", "Creates a JSON response with appropriate Content-Type"]], "concepts33": [["response.ok", "Checks for HTTP 2xx; fetch usually resolves on 404/500"], ["try/catch", "Handles network, parsing, and explicitly thrown errors"], ["Error UI", "Separates loading, error, success and offers retry"]], "questions32": [["What does a GET Handler do?", ["Apply CSS", "Process GET requests and return data", "Delete the DB", "Compress files"], "B", "It returns an HTTP response to a GET request."], ["Which file implements /api/orders?", ["app/api/orders/route.ts", "app/api/orders/page.tsx", "public/orders.json", "components/orders.tsx"], "A", "This project uses the root app directory."], ["What does ERR_CONNECTION_REFUSED mean?", ["Invalid JSON", "Success", "Server connection refused", "Missing order"], "C", "The connection failed before an HTTP response."], ["Which code means the route is missing?", ["200", "400", "404", "500"], "C", "404 indicates a missing resource or route."], ["What fixed the observed 404?", ["Change prices", "Move route file", "Edit CSS", "Change browser"], "B", "Moving route.ts into the active app tree fixed it."], ["Was Turbopack cache corruption proven?", ["Yes", "Still a hypothesis", "An HTTP standard", "DB connected"], "B", "The observed behavior does not prove the root cause."]], "questions33": [["What does HTTP 200 mean?", ["Success", "Bad input", "Missing resource", "Server failure"], "A", "2  if(day===32){add(main,'h2',t.timeline);t.timelineitems.forEach(([name,desc,kind])=>{const p=add(main,'article',undefined,'timeline');const row=add(p,'div',undefined,'row');add(row,'strong',name);add(row,'span',t[kind],'tag '+kind);add(p,'p',desc)})}
 add(main,'h2',day===32?'GET /api/orders':'GET /api/orders · error handling');
 if(day===33)add(main,'span',t.practice,'tag possible');
 const code=day===32?`// app/api/orders/route.ts
const orders = [{ id: 1, product: "Keyboard" }, { id: 2, product: "Mouse" }, { id: 3, product: "USB-C Hub" }];
export async function GET() {
  return Response.json({ success: true, count: orders.length, orders }, { status: 200 });
}`:`// app/api/orders/route.ts — practice example
const orders = [{ id: 1, product: "Keyboard" }];
export async function GET(request: Request) {
  try {
    const value = new URL(request.url).searchParams.get("id");
    if (value !== null) {
      const id = Number(value);
      if (!Number.isInteger(id) || id <= 0)
        return Response.json({ error: "Invalid ID" }, { status: 400 });
      const order = orders.find(o => o.id === id);
      if (!order) return Response.json({ error: "Not found" }, { status: 404 });
      return Response.json({ order }, { status: 200 });
    }
    return Response.json({ orders }, { status: 200 });
  } catch (error) {
    console.error(error);
    return Response.json({ error: "Server error" }, { status: 500 });
  }
}

 add(main,'pre',code,'code');

 qarr.forEach((q,i)=>{const card=add(main,'article',undefined,'qcard');add(card,'div','Q'+String(i+1).padStart(2,'0'),'num');add(card,'h3',q[0]);q[1].forEach((opt,j)=>{const p=add(card,'div',undefined,'opt');add(p,'b','ABCD'[j]);p.append(document.createTextNode(opt))});const line=add(card,'div',undefined,'answerline');add(line,'span',t.answer+'  ','hint');const input=add(line,'input',undefined,'answer');input.maxLength=1;input.value=a[i];input.setAttribute('aria-label',t.answer+' Q'+(i+1));input.oninput=()=>{input.value=input.value.toUpperCase().replace(/[^ABCD]/g,'');a[i]=input.value};if(graded[key()]){const fb=add(card,'div',undefined,'feedback');add(fb,'strong',(a[i]===q[2]?'✓ ':'✕ ')+q[2],a[i]===q[2]?'good':'bad');add(fb,'p',q[3])}});
 const actions=add(main,'div',undefined,'actions');const g=add(actions,'button',t.grade,'btn primary');g.onclick=()=>{graded[key()]=true;render()};const r=add(actions,'button',t.reset,'btn');r.onclick=()=>{answers[key()]=Array(qarr.length).fill('');written[key()]=Array(3).fill('');graded[key()]=false;reveal[key()]={};render()};if(graded[key()])add(actions,'span',t.scored+': '+qarr.filter((q,i)=>a[i]===q[2]).length+'/'+qarr.length,'result');
 add(main,'h2',t.written);add(main,'p',t.tips,'hint');
 const w=written[key()]??Array(3).fill('');written[key()]=w;
 t['written'+day].forEach((q,i)=>{const card=add(main,'article',undefined,'qcard');add(card,'div','S'+String(i+1).padStart(2,'0'),'num');add(card,'h3',q[0]);const input=add(card,'textarea',undefined,'written');input.value=w[i];input.placeholder=t.response;input.oninput=()=>{w[i]=input.value};const btn=add(card,'button',t.reveal,'btn');const feedback=add(card,'div',undefined,'feedback');feedback.hidden=!(reveal[key()]||{})[i];function show(){feedback.replaceChildren();add(feedback,'p',q[1]);const lower=w[i].toLowerCase();q[2].forEach(word=>add(feedback,'span',(lower.includes(word.toLowerCase())?'✓ ':'○ ')+word,'tag '+(lower.includes(word.toLowerCase())?'':'possible')))}if(!feedback.hidden)show();btn.onclick=()=>{reveal[key()]??={};reveal[key()][i]=!reveal[key()][i];feedback.hidden=!reveal[key()][i];btn.textContent=feedback.hidden?t.reveal:t.hide;if(!feedback.hidden)show()}});
 add(main,'h2',t.notes);add(main,'p',t.notehelp,'hint');const notegrid=add(main,'div',undefined,'notegrid');
 const fields=['errorlabel','analysislabel','fixlabel','lessonlabel'];const boxes={};const storekey='day32-33-journal-'+lang+'-'+day;let saved={};try{saved=JSON.parse(localStorage.getItem(storekey)||'{}')}catch{}
 fields.forEach(f=>{const box=add(notegrid,'div',undefined,'notebox');add(box,'label',t[f]);const area=add(box,'textarea');area.value=saved[f]||'';boxes[f]=area;area.oninput=save});
